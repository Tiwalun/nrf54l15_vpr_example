name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
    security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: rustup install
      - uses: swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            app-core
            flpr-core
            nrf-vpr-clic

      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just,cargo-binutils,clippy-sarif,sarif-fmt

      - run: just ci
        env:
          CARGO_BUILD_WARNINGS: deny

      - uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: target/clippy_app.sarif
          category: clippy-app

      - uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: target/clippy_flpr.sarif
          category: clippy-flpr

      - uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: target/clippy_clic.sarif
          category: clippy-clic

name: Build

on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup install
      - run: just ci

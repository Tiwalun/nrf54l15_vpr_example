[package]
name = "nrf54l15-app"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.3"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-nrf = { version = "0.11.0", features = [
    "defmt",
    "nrf54l15-app-s",
    "time-driver-grtc",
    "gpiote",
    "unstable-pac",
    "time",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
#nrf54l15-app-pac = { version = "0.12.2", path = "../nrf54l15-app-pac", features = [
#    "rt",
#] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
